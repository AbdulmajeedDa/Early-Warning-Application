name: early_warning
description: Early Warning - نظام الإنذار المبكر
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  audioplayers: ^6.0.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

# Native launch screen (shown by Android before Flutter starts): fixed dark
# background (same as the app's dark theme bg) + the logo, no text.
# Generate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#080D1A"
  image: assets/images/splash_logo.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#080D1A"
    image: assets/images/splash_logo.png
